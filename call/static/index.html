<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TW Calls">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>TW Calls</title>
<style>
  :root { --bg:#000; --fg:#fff; --dim:#8e8e93; --key:#333336; --green:#30d158; --red:#ff453a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif; }
  main { height:100%; display:flex; flex-direction:column; align-items:center;
    padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 20px); }
  #status { color:var(--dim); font-size:15px; min-height:20px; text-align:center; }
  #status.bad { color:var(--red); }
  #number { font-size:38px; font-weight:300; min-height:56px; margin:28px 0 8px; letter-spacing:1px;
    text-align:center; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #sub { color:var(--dim); font-size:17px; min-height:22px; margin-bottom:auto; }
  #pad { display:grid; grid-template-columns:repeat(3,78px); gap:16px 26px; margin:24px 0; }
  .key { width:78px; height:78px; border-radius:50%; border:0; background:var(--key); color:var(--fg);
    font-size:34px; font-weight:400; display:flex; flex-direction:column; align-items:center;
    justify-content:center; line-height:1; }
  .key small { font-size:10px; letter-spacing:2px; color:#ddd; margin-top:2px; font-weight:600; }
  .key:active { background:#737373; }
  #actions { display:grid; grid-template-columns:repeat(3,78px); gap:26px; align-items:center;
    justify-items:center; }
  .round { width:78px; height:78px; border-radius:50%; border:0; display:grid; place-items:center; }
  .round svg { width:34px; height:34px; fill:#fff; }
  .call { background:var(--green); }
  .end { background:var(--red); }
  .end svg { transform:rotate(135deg); }
  .ghost { background:none; color:var(--fg); font-size:15px; width:78px; height:78px; border:0; }
  .ghost.on { background:#fff; color:#000; border-radius:50%; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <div id="status">Connecting…</div>
  <div id="number"></div>
  <div id="sub"></div>
  <div id="pad"></div>
  <div id="actions">
    <button class="ghost" id="mute" hidden>mute</button>
    <span id="leftgap"></span>
    <button class="round call" id="callBtn" aria-label="Call"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></button>
    <button class="round end" id="endBtn" aria-label="End" hidden><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></button>
    <button class="ghost" id="del">delete</button>
  </div>
</main>
<audio id="remote" autoplay playsinline></audio>
<script>
const $ = (id) => document.getElementById(id);
const KEYS = [['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']];
let typed = '';
let phone = { connected: false, calls: [] };
let ws, pc, mic, callStart, endTimer;

for (const [d, letters] of KEYS) {
  const b = document.createElement('button');
  b.className = 'key';
  b.innerHTML = `${d}<small>${letters}</small>`;
  b.onclick = () => press(d);
  if (d === '0') b.oncontextmenu = (e) => { e.preventDefault(); press('+'); };
  $('pad').appendChild(b);
}

function press(d) {
  if (activeCall()) { send('dtmf', d === '+' ? '0' : d); flash(d); return; }
  typed += d;
  render();
}

let flashTimer;
function flash(d) {
  $('sub').textContent = `tone ${d}`;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(render, 700);
}

function activeCall() { return phone.calls.find((c) => c.state !== 'disconnected'); }

function send(op, arg = '') {
  if (!ws || ws.readyState !== 1) { setStatus('Not connected to the Pi', true); return; }
  ws.send(JSON.stringify({ op, arg }));
}

function setStatus(text, bad = false) {
  $('status').textContent = text;
  $('status').classList.toggle('bad', bad);
}

const LABEL = { incoming: 'Incoming call', dialing: 'Calling…', alerting: 'Ringing…', active: '', held: 'On hold', waiting: 'Call waiting' };

function render() {
  const call = activeCall();
  setStatus(phone.connected ? 'Taiwan phone ready' : 'Taiwan phone not connected over Bluetooth', !phone.connected);
  $('number').textContent = call ? (call.number || 'Unknown') : typed;
  $('del').hidden = !!call || !typed;
  $('mute').hidden = !call || call.state === 'incoming';
  $('leftgap').hidden = !$('mute').hidden;
  const incoming = call && call.state === 'incoming';
  $('callBtn').hidden = !!call && !incoming;
  $('endBtn').hidden = !call;
  if (call && call.state === 'active') {
    callStart = callStart || Date.now();
    const s = Math.floor((Date.now() - callStart) / 1000);
    $('sub').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  } else {
    if (!call || call.state !== 'active') callStart = null;
    $('sub').textContent = call ? (LABEL[call.state] ?? call.state) : '';
  }
}
setInterval(() => { if (activeCall()) render(); }, 1000);

function connect() {
  ws = new WebSocket(`wss://${location.host}/ws`);
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.error) { setStatus(msg.error, true); return; }
    phone = msg;
    // The phone briefly reports no call while a call changes state, so audio stops only once
    // the call has been gone for a few seconds.
    clearTimeout(endTimer);
    if (!activeCall() && pc) endTimer = setTimeout(() => !activeCall() && stopAudio(), 3000);
    render();
  };
  ws.onclose = () => { setStatus('Reconnecting to the Pi…', true); setTimeout(connect, 2000); };
}
connect();

async function startAudio() {
  if (pc && pc.connectionState !== 'failed' && pc.connectionState !== 'closed') return;
  mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  pc = new RTCPeerConnection({ iceServers: [] });
  mic.getTracks().forEach((t) => pc.addTrack(t, mic));
  pc.ontrack = (e) => { $('remote').srcObject = e.streams[0] || new MediaStream([e.track]); $('remote').play(); };
  await pc.setLocalDescription(await pc.createOffer());
  await new Promise((resolve) => {
    if (pc.iceGatheringState === 'complete') return resolve();
    pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && resolve();
    setTimeout(resolve, 3000);
  });
  const res = await fetch('/offer', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }) });
  if (!res.ok) throw new Error(`audio setup failed: ${res.status}`);
  await pc.setRemoteDescription(await res.json());
}

function stopAudio() {
  if (pc) pc.close();
  if (mic) mic.getTracks().forEach((t) => t.stop());
  pc = mic = null;
  $('mute').classList.remove('on');
}

$('callBtn').onclick = async () => {
  const call = activeCall();
  if (!call && !typed) return;
  try { await startAudio(); } catch (e) { setStatus(`Microphone/audio: ${e.message}`, true); return; }
  if (call && call.state === 'incoming') send('answer');
  else { send('dial', typed); typed = ''; }
};
$('endBtn').onclick = () => { send('hangup'); stopAudio(); };
$('del').onclick = () => { typed = typed.slice(0, -1); render(); };
$('mute').onclick = () => {
  if (!mic) return;
  const on = !$('mute').classList.contains('on');
  mic.getAudioTracks().forEach((t) => (t.enabled = !on));
  $('mute').classList.toggle('on', on);
};
render();
</script>
</body>
</html>
